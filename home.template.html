<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>𝕏侧栏 · 拖到收藏栏</title><link rel="icon" type="image/svg+xml" href="favicon.svg?v=2"><meta name="theme-color" content="#111111">
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:system-ui,"Microsoft YaHei",sans-serif}main{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:clamp(96px,16vh,160px) 24px 32px;text-align:center}.brand{margin:0 0 20px;font-size:18px;font-weight:600;letter-spacing:5px}h1{margin:0 0 12px;font-size:clamp(26px,5vw,40px);font-weight:550;letter-spacing:-1px}.hint{margin:0 0 36px;color:#666;font-size:14px;line-height:1.8}.install{display:flex;align-items:center;justify-content:center;gap:30px;width:min(100%,340px);min-height:80px;padding:22px 28px;background:#111;color:#fff;text-decoration:none;border:1px solid #111;border-radius:8px;font-size:20px;font-weight:600;cursor:grab;transition:background .15s}.install:hover{background:#333}.install:active{cursor:grabbing}.install:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid #111;outline-offset:6px}.arrow{font-size:24px;font-weight:400}.after{margin:24px 0 0;color:#666;font-size:13px;line-height:1.8}.after a{color:#111;text-underline-offset:3px}details{margin-top:32px;width:min(100%,340px);font-size:12px;color:#777}summary{display:inline-block;cursor:pointer;text-decoration:underline;text-underline-offset:4px}details p{line-height:1.8;text-align:left}textarea{width:100%;height:76px;padding:10px;border:1px solid #ddd;border-radius:4px;resize:vertical;font:11px/1.5 monospace}button{border:1px solid #111;border-radius:4px;background:white;color:#111;padding:8px 14px;cursor:pointer;font:12px system-ui;margin-top:10px}#result{font-size:12px;line-height:1.7;color:#555;margin:14px 0 0;max-width:340px}.site-footer{margin-top:auto;padding-top:24px;min-height:60px;display:flex;align-items:center;justify-content:center;gap:12px;color:#666;font-size:11px}.site-footer a{display:grid;place-items:center;width:24px;height:24px;color:#111;text-decoration:none;opacity:.7}.site-footer a:hover{opacity:1}.site-footer a:focus-visible{outline:2px solid #111;outline-offset:2px}.site-footer svg{width:17px;height:17px}.site-footer .x-icon{font:18px/1 system-ui}#result:empty{display:none}@media(prefers-reduced-motion:reduce){.install{transition:none}}
.drag-guide{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}.guide-line{fill:none;stroke:#999;stroke-width:1.5;stroke-dasharray:5 7;animation:guide-flow 1.8s linear infinite}.guide-cursor{fill:#111;stroke:white;stroke-width:2}.guide-label rect{fill:#fff}.guide-label text{fill:#111;font:600 13px system-ui,"Microsoft YaHei",sans-serif;letter-spacing:2px}.guide-target{position:fixed;top:18px;left:70%;transform:translateX(-50%);padding:8px 22px;border:1px dashed #aaa;border-radius:5px;color:#777;background:white;font-size:12px;pointer-events:none;z-index:3}.dragging .guide-line{stroke:#111;stroke-width:2}.dragging .guide-target{color:#111;border-color:#111}@keyframes guide-flow{to{stroke-dashoffset:-24}}@media(max-width:700px),(max-height:580px){.drag-guide,.guide-target{display:none}}@media(prefers-reduced-motion:reduce){.guide-line{animation:none}.guide-cursor{display:none}}.launch-demo{position:relative;width:min(100%,360px);height:124px;margin-top:25px;border:1px solid #d5d5d5;border-radius:7px;overflow:hidden;text-align:left;background:#fff}.launch-bar{height:40px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid #ddd;background:#f7f7f7;font-size:11px;color:#777}.launch-bookmark{border:1px solid #bbb;border-radius:4px;padding:3px 8px;background:#fff;color:#111;animation:bookmark-press 4s ease-in-out infinite}.launch-body{position:relative;height:84px;padding:20px 14px;color:#777;font-size:12px}.launch-sidebar{position:absolute;right:0;top:0;height:100%;width:46%;display:grid;place-items:center;border-left:1px solid #111;background:#f5f5f5;color:#111;font-size:12px;transform:translateX(102%);animation:sidebar-open 4s ease-in-out infinite}.launch-pointer{position:absolute;left:120px;top:66px;width:0;height:0;border-left:9px solid #111;border-top:14px solid transparent;transform:rotate(-25deg);filter:drop-shadow(1px 1px white);animation:move-pointer 4s ease-in-out infinite}@keyframes move-pointer{0%,10%{left:120px;top:66px;opacity:0}25%{opacity:1}40%,58%{left:75px;top:28px;opacity:1}70%,100%{left:75px;top:28px;opacity:0}}@keyframes bookmark-press{0%,42%,56%,100%{background:#fff;color:#111}47%,52%{background:#111;color:#fff}}@keyframes sidebar-open{0%,50%{transform:translateX(102%)}68%,90%{transform:translateX(0)}100%{transform:translateX(102%)}}@media(prefers-reduced-motion:reduce){.launch-pointer{display:none}.launch-bookmark{animation:none}.launch-sidebar{animation:none;transform:none}}</style></head>
<body><span class="guide-target" aria-hidden="true">↑ 浏览器收藏栏</span><svg class="drag-guide" aria-hidden="true"><defs><marker id="guide-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#777" stroke-width="1.5"/></marker></defs><path id="guide-path" class="guide-line" marker-end="url(#guide-arrow)"/><g id="guide-label" class="guide-label"><rect x="-30" y="-13" width="60" height="26" rx="4"/><text x="0" y="5" text-anchor="middle">拖动</text></g><circle r="5" class="guide-cursor"><animateMotion id="guide-motion" dur="2.8s" repeatCount="indefinite"/></circle></svg><main><p class="brand">𝕏侧栏</p><a class="install" id="install-bookmark" href="__BOOKMARK_URL__" draggable="true" aria-label="开启x侧栏" title="开启x侧栏">开启x侧栏</a><p class="after">拖到收藏栏，再到 <a href="https://x.com/home" target="_blank" rel="noopener">X 主页</a> 或 <a href="https://x.com/notifications" target="_blank" rel="noopener">通知页</a> 点击「开启x侧栏」。</p><div class="launch-demo" aria-hidden="true"><div class="launch-bar"><span>收藏栏</span><span class="launch-bookmark">开启x侧栏</span></div><div class="launch-body">X 主页 / 通知<div class="launch-sidebar">侧栏已开启</div></div><span class="launch-pointer"></span></div><details><summary>无法拖动？</summary><p>可下载带图标的书签文件，在浏览器书签管理器中导入；或手动新建书签，粘贴下方代码。</p><p><a href="x-quick-comment-bookmarks.html" download>下载带图标的书签文件</a></p><textarea id="bookmark-code" readonly aria-label="书签代码" spellcheck="false"></textarea><button id="copy-code" type="button">复制代码</button></details><footer class="site-footer" aria-label="相关链接"><a class="xqc-update" href="https://x.usdts.de/" target="_blank" rel="noopener noreferrer" aria-label="更新主页" title="更新主页"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="M13 3h8v8M21 3l-10 10"/></svg></a><a href="https://github.com/ToTXoX/x-quick-comment" target="_blank" rel="noopener noreferrer" aria-label="GitHub 仓库" title="GitHub 仓库"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3"/><path d="M15 22v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 19 4.77 5.07 5.07 0 0 0 18.91 1S17.73.65 15 2.48a13.38 13.38 0 0 0-7 0C5.27.65 4.09 1 4.09 1A5.07 5.07 0 0 0 4 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 8 18.13V22"/></svg></a><span>by dk021</span><a href="https://x.com/yygqdkqk" target="_blank" rel="noopener noreferrer" aria-label="dk021 的 X 主页" title="dk021 的 X 主页"><span class="x-icon" aria-hidden="true">𝕏</span></a></footer><p id="result" role="status" aria-live="polite"></p></main>
<script>
const bookmark=__BOOKMARK_JSON__;
document.getElementById('bookmark-code').value=bookmark;
const installButton=document.getElementById('install-bookmark');
function positionGuide(){const r=installButton.getBoundingClientRect(),endX=Math.max(90,r.left-64);const curve=`M ${r.left-12} ${r.top+r.height/2} C ${Math.max(30,r.left-110)} ${r.top+r.height/2}, ${endX-40} 100, ${endX} 62`;document.querySelector('.guide-target').style.left=endX+'px';document.getElementById('guide-path').setAttribute('d',curve);document.getElementById('guide-motion').setAttribute('path',curve);document.getElementById('guide-label').setAttribute('transform',`translate(${r.left-84} ${Math.max(92,r.top-40)})`);}
positionGuide();window.addEventListener('resize',positionGuide);window.addEventListener('scroll',positionGuide,{passive:true});
installButton.addEventListener('dragstart',()=>document.body.classList.add('dragging'));
installButton.addEventListener('dragend',()=>document.body.classList.remove('dragging'));

document.getElementById('install-bookmark').addEventListener('click',event=>{event.preventDefault();document.getElementById('result').textContent='先拖到收藏栏；打开 X 页面后，点击收藏栏里的「开启x侧栏」。看不到收藏栏？按 Ctrl+Shift+B。';});
document.getElementById('copy-code').onclick=async()=>{try{await navigator.clipboard.writeText(bookmark);document.getElementById('result').textContent='已复制，粘贴到书签的网址栏。';}catch{const box=document.getElementById('bookmark-code');box.focus();box.select();document.getElementById('result').textContent='按 Ctrl+C 复制，再粘贴到书签的网址栏。';}};
</script></body></html>
